<!DOCTYPE html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>撲克弱點特訓</title><style>body{margin:0;background:#0b1a13;color:#e8efe9;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;line-height:1.6}

.bar{background:#22392d;height:8px;border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:#f2c94c}
table{width:100%;border-collapse:collapse;margin:14px 0}td,th{padding:8px;border-bottom:1px solid #2a4a3a;text-align:left}
.top{display:flex;justify-content:space-between;align-items:center}.tag{display:inline-block;background:#2d5b45;padding:2px 10px;border-radius:10px;font-size:13px;margin-top:8px}
.felt{background:radial-gradient(#1f6b45,#0f3d27);border-radius:14px;padding:12px;margin:10px 0}.felt small{color:#cde}

.cd.s{color:#111}.cd.c{color:#1a7f37}.cd.h{color:#d11}.cd.d{color:#1565c0}.su{font-weight:700;background:#fff;border-radius:4px;padding:0 3px}.su.s{color:#111}.su.c{color:#1a7f37}.su.h{color:#d11}.su.d{color:#1565c0}
.q{font-weight:700}.opt,.next,.ghost{display:block;width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #3a5a4a;background:#1a3326;color:#e8efe9;font-size:16px;text-align:left;cursor:pointer}
.ghost{background:none;width:auto;display:inline-block}.next{background:#f2c94c;color:#111;font-weight:700;text-align:center}
.opt.ok{background:#1f6b3a;border-color:#4c4}.opt.bad{background:#6b1f1f;border-color:#c44}.ex{padding:12px;border-radius:10px;margin-top:10px}.ex.g{background:#173d27}.ex.r{background:#3d1b1b}.big{font-size:40px;text-align:center;color:#f2c94c}</style></head><body><div id="app"></div><script>const CATS={B:"阻擋牌",R:"河牌組合計算",A:"攻擊性的時機",M:"多人底池"};
const DAYS=[
{t:"第 1 天：阻擋牌與組合計算的基本功",q:[
{c:"B",s:"單挑，100BB。底池 40BB，河牌你過牌，對手下注 40BB（滿池）。你有一對 A 要抓詐唬。",b:["Ah","Th","7c","3h","8d"],h:null,q:"下面哪手牌最適合跟注？",o:["A♠J♥","A♣J♠","兩手一樣"],a:0,e:"抓詐唬時要<b>阻擋對手的價值牌</b>。J♥ 讓對手的同花組合變少（J♥x♥ 全部消失），所以他下注時是詐唬的比例變高。A♣J♠ 什麼都沒阻擋。口訣：<b>抓詐唬阻擋價值，詐唬時不要阻擋棄牌</b>。"},
{c:"B",s:"單挑，你在按鈕。翻牌、轉牌都過牌，河牌對手又過牌。你想詐唬。對手會跟注的牌主要是 KQ、KJ、Qx；會棄的牌是小對子和沒中的聽牌。",b:["Qs","Jd","6c","3h","2d"],h:null,q:"哪一手比較適合拿來詐唬？",o:["K♠T♠","8♣7♣"],a:0,e:"K♠T♠ 阻擋了對手會<b>跟注</b>的 KQ、KJ（各少了 4 組中的 1/4），又沒阻擋他會棄的小對子。8♣7♣ 沒有擋到任何跟注牌，詐唬效果較差。詐唬時：<b>擋跟注、不擋棄牌</b>。"},
{c:"R",s:"組合基本功：未配對的兩張牌（例如 AK）共 16 組，其中同花 4 組；口袋對子 6 組。公共牌已經用掉的牌要扣掉。",b:["8d","3c","Js","2h","Kc"],h:null,q:"對手如果拿 88（暗三條），還剩幾組？",o:["6 組","3 組","1 組"],a:1,e:"88 原本 C(4,2)=6 組。牌面有一張 8♦，剩 3 張 8，C(3,2)=<b>3 組</b>。公式：剩 n 張，組合數 = n×(n−1)/2。"},
{c:"R",s:"你拿 K♥Q♠，牌面如下。對手的河牌價值範圍假設是 KK、JJ、AK。",b:["Kc","Jd","5s","2h","2c"],h:["Kh","Qs"],q:"對手價值組合共有幾組？",o:["12 組","17 組","22 組"],a:0,e:"KK：剩 K♠K♦ → 1 組。JJ：剩 3 張 J → 3 組。AK：4 張 A × 剩 2 張 K = 8 組。合計 <b>12 組</b>。注意你手上的 K♥ 讓 KK 和 AK 都大幅減少，這就是卡牌移除效果。"},
{c:"R",s:"河牌底池 100BB，對手下注 75BB。你估計他的價值組合有 14 組，詐唬組合有 4 組。你有抓詐唬的牌。",b:["Td","9c","4s","Jh","2d"],h:["Tc","8c"],q:"該怎麼做？",o:["跟注","棄牌"],a:1,e:"需要勝率 = 75 ÷ (100+75+75) = <b>30%</b>。詐唬比例 = 4 ÷ 18 ≈ 22%，低於 30%，所以<b>棄牌</b>。流程：①算需要的勝率 ②數價值組合 ③數詐唬組合 ④比較。"},
{c:"A",s:"單挑 100BB。你在按鈕開池，大盲跟注。翻牌你下注 1/3 底池，大盲跟注。轉牌 2♣，大盲過牌。底池約 11BB。",b:["Js","8s","3d","2c"],h:["As","5s"],q:"你怎麼做？",o:["過牌","下注 1/3 底池","下注 2/3～滿池"],a:2,e:"A♠5♠ 是堅果同花聽牌 + A 高 + 阻擋對手的 A 高同花，是最好的半詐唬之一。下大可以逼掉 Tx、9x、小對子等有攤牌價值的牌（棄牌收益），中同花時底池也更大。小注給對手便宜的價格，反而浪費了這手牌的威力。"},
{c:"A",s:"單挑，你在大盲跟注按鈕開池。翻牌你過牌，按鈕下注 1/3 底池。",b:["Kd","8c","4s"],h:["9h","8h"],q:"你怎麼做？",o:["棄牌","跟注","過牌加注"],a:1,e:"第二對有不錯的攤牌價值。加注的話，比你差的牌（兩高張、聽牌）大多棄牌，繼續的多是 Kx，把中等牌變成詐唬。<b>跟注</b>可以留住按鈕的大量詐唬。過牌加注留給暗三條、兩對和好的聽牌。"},
{c:"M",s:"4 人底池：你在 CO 開池 2.5BB，按鈕、小盲、大盲都跟注。小盲、大盲過牌給你。",b:["Ad","7c","2s"],h:["Jh","Jd"],q:"你怎麼做？",o:["過牌","下注 1/3","下注 3/4"],a:0,e:"三個對手中有人拿 A 的機率很高。JJ 下注時，比你差的牌（77 以下、7x）很少會跟，會跟的多半贏你，所以下注既不是價值也不是好詐唬。多人底池<b>中等牌傾向過牌控池</b>，保留攤牌價值。"},
{c:"M",s:"3 人底池：你在 CO 開池，按鈕和大盲跟注。大盲過牌。",b:["Kh","9c","4d"],h:["Ac","Kd"],q:"你怎麼做？",o:["過牌慢打","下注約 1/2～2/3 底池"],a:1,e:"多人底池不是不能下注，而是<b>要下得誠實</b>：真正有牌時就下注拿價值。頂對頂踢腳在多人底池有很多 Kx、9x、聽牌會跟。過牌反而錯過價值，還讓對手免費實現勝率。"},
{c:"B",s:"單挑，河牌出現第三張黑桃，你過牌，對手下注 2/3 底池。你有頂對要抓詐唬。",b:["Js","9s","4d","2c","5s"],h:null,q:"哪手比較適合跟注？",o:["J♥T♥","K♠J♦"],a:1,e:"K♠J♦ 拿著 K♠，對手就沒有 K 高同花（第二大的同花），同花組合減少，詐唬比例相對變高，而且 K 踢腳也更好。抓詐唬時要<b>阻擋對手的價值牌</b>。"},
{c:"R",s:"河牌底池 60BB，對手下注 60BB（滿池）。你數出他價值組合 18 組，詐唬組合 6 組。",b:["Th","7h","4c","2s","Ad"],h:["Ts","9s"],q:"該怎麼做？",o:["跟注","棄牌"],a:1,e:"需要勝率 = 60 ÷ 180 = <b>33%</b>。詐唬比例 = 6 ÷ 24 = 25%，不夠，<b>棄牌</b>。若詐唬組合是 9 組（9/27=33%）就是兩可；更多就跟注。"},
{c:"A",s:"延續第 6 題：轉牌你下注 2/3 底池被跟注。河牌 K♥，大盲過牌。你沒中同花。",b:["Js","8s","3d","2c","Kh"],h:["As","5s"],q:"你怎麼做？",o:["過牌攤牌","下注約 2/3～3/4 底池詐唬"],a:1,e:"A 高幾乎贏不了任何跟注了兩條街的牌，過牌攤牌通常會輸。K 是對按鈕範圍有利的牌（你有更多 Kx），你的故事可信，且 A5 沒有阻擋對手會棄的聽牌（T9、Q9、黑桃聽牌），是理想的<b>繼續詐唬</b>。半詐唬要有完整計畫。"}
]},
{t:"第 2 天：河牌數組合 + 攻擊性用對地方",q:[
{c:"R",s:"你拿 J♣T♣，牌面如下。你想知道對手做成順子的組合。",b:["Ts","9d","4c","2h","8s"],h:["Jc","Tc"],q:"對手 QJ（順子）有幾組？",o:["16 組","12 組","9 組"],a:1,e:"Q 有 4 張，J 因為你拿了 J♣ 只剩 3 張：4×3 = <b>12 組</b>。你的 J 阻擋了對手最大的順子，這就是抓詐唬時有利的阻擋。"},
{c:"R",s:"延續上題，河牌底池 50BB，對手下注 50BB。你估計他的價值：QJ 12 組、76 16 組、兩對 10 組；詐唬：A 高沒中 8 組。",b:["Ts","9d","4c","2h","8s"],h:["Jc","Tc"],q:"該怎麼做？",o:["跟注","棄牌"],a:1,e:"需要 33%。詐唬 8 ÷（38+8）≈ 17%，遠低於 33%，<b>棄牌</b>。頂對在四張連牌的河牌面對滿池，往往不夠格。"},
{c:"A",s:"單挑，你在大盲。翻牌過牌跟注 1/3，轉牌你過牌，按鈕下注 2/3 底池。",b:["Qd","7c","3s","2h"],h:["Js","Jc"],q:"你怎麼做？",o:["棄牌","跟注","過牌加注"],a:1,e:"JJ 是中等強度的抓詐唬牌。加注時比你差的牌全棄，只有 Qx 以上繼續——把好的攤牌牌變成詐唬。<b>跟注</b>，讓對手的詐唬和薄價值繼續下注。"},
{c:"A",s:"單挑，你在大盲跟注按鈕開池。翻牌你過牌，按鈕下注 1/3 底池。",b:["7h","6c","2h"],h:["9h","8h"],q:"你怎麼做？",o:["棄牌","跟注","過牌加注"],a:2,e:"兩頭順聽牌 + 同花聽牌，約 15 張出牌，對抗 overpair 也有約 50% 勝率。這是<b>該兇的牌</b>：加注有棄牌收益，被跟也常常領先或接近五五波。和中等成牌相反：聽牌強時要加注，成牌中等時要跟注。"},
{c:"M",s:"3 人底池，你在按鈕跟注 CO 開池，大盲也跟。翻牌全部過牌到你。",b:["Kc","7d","2h"],h:["6c","6d"],q:"你怎麼做？",o:["過牌","下注 1/3 偷池"],a:0,e:"兩個人都過牌，但多人底池裡你的小對子攤牌價值不錯，下注只會被 Kx、7x 跟、比你差的都會棄。多人底池<b>詐唬成功率低</b>，過牌拿免費牌、保留攤牌價值。"},
{c:"B",s:"單挑，河牌方塊成同花。你過牌，對手下注滿池。你有頂對。",b:["Qd","Jd","4s","2c","9d"],h:null,q:"哪手比較適合跟注？",o:["Q♠T♦","Q♣T♣"],a:0,e:"T♦ 阻擋對手的方塊同花（T♦x♦ 消失），也略微阻擋 KT 順子。抓詐唬時阻擋價值。"},
{c:"R",s:"河牌底池 40BB，對手超池下注 80BB。",b:["As","Kd","8c","4h","2s"],h:["Ah","Qc"],q:"你需要多少勝率才能跟注？",o:["33%","40%","50%"],a:1,e:"80 ÷ (40+80+80) = 80 ÷ 200 = <b>40%</b>。下注越大，你需要的勝率越高，但對手也必須有足夠價值支撐這個尺寸。"},
{c:"A",s:"單挑，你在按鈕開池，大盲跟注。翻牌你下注被跟注。轉牌 9♦，大盲過牌。",b:["Ks","7d","3c","9d"],h:["Qd","Jd"],q:"你怎麼做？",o:["過牌","下注約 2/3 底池"],a:1,e:"QJ 有卡順聽牌（T）+ 方塊同花聽牌 + 兩張高牌出牌，是很好的半詐唬。下注能逼掉 7x、3x、小對子，沒中時河牌也有詐唬的選擇。半詐唬時<b>主動</b>。"},
{c:"M",s:"3 人底池：CO 開池，你在大盲跟注，按鈕也跟。翻牌你過牌，CO 下注 1/3，按鈕跟注。",b:["Kc","5c","2d"],h:["9c","8c"],q:"你怎麼做？",o:["棄牌","跟注","過牌加注"],a:1,e:"同花聽牌在多人底池賠率很好（底池裡有兩個人的錢），<b>跟注</b>即可。過牌加注夾在兩個對手中間，棄牌收益低，按鈕還可能再加。多人底池半詐唬要更節制。"},
{c:"B",s:"單挑，河牌對手過牌，你想詐唬。對手會棄的主要是沒中的順子聽牌（JT、T7、76）。",b:["9h","8c","2d","4s","As"],h:null,q:"哪手比較適合詐唬？",o:["J♦T♦","6♦5♦"],a:1,e:"J♦T♦ 拿著 J、T，剛好擋掉對手會棄的 JT、T7 組合，讓他剩下的範圍更多是會跟的牌。65 擋的會棄牌較少。<b>詐唬時不要阻擋對手的棄牌範圍</b>。"},
{c:"R",s:"牌面兩張紅心，河牌沒成同花。你想估計對手沒中的紅心聽牌。",b:["Kh","Th","4c","2s","7d"],h:["Ks","Qs"],q:"剩下的紅心兩兩組合總共有幾組（不考慮範圍）？",o:["55 組","66 組","78 組"],a:0,e:"紅心 13 張扣掉牌面 2 張 = 11 張，C(11,2) = 11×10÷2 = <b>55 組</b>。實際範圍只會包含其中一部分（例如 A♥x♥、Q♥J♥），但這幫你理解「詐唬組合」從哪裡來。"},
{c:"A",s:"單挑，河牌對手過牌。底池 30BB，你剩 80BB。",b:["9s","8s","2d","5c","6h"],h:["Tc","7c"],q:"你拿堅果順子，怎麼做？",o:["下注 1/3","下注 2/3","超池 125%～150%"],a:2,e:"你拿堅果，而對手的範圍有很多 7x、兩對、暗三條會不甘心棄牌。這類「堅果 vs 封頂範圍」的情況最適合<b>超池</b>拿最多價值。攻擊性的正確地方：極強牌和極弱牌（詐唬）。"}
]},
{t:"第 3 天：綜合難題 + 總複習",q:[
{c:"B",s:"總複習：河牌你過牌，對手滿池下注。",b:["Ah","Th","7c","3h","8d"],h:null,q:"哪手最適合抓詐唬？",o:["A♣9♣","A♣J♠","A♠J♥"],a:2,e:"只有 A♠J♥ 拿著紅心，阻擋了對手的同花價值。抓詐唬 = 阻擋價值。"},
{c:"B",s:"總複習：你在按鈕，翻牌轉牌下注都被跟。河牌對手過牌，底池 40BB。",b:["Ac","Kd","7s","2h","4c"],h:["Qs","Js"],q:"你怎麼做？",o:["過牌放棄","下注 1/2","下注滿池"],a:0,e:"對手跟了兩條街，大多是 Ax、Kx，很少棄。你的 Q、J 擋掉了他會棄的 QT、JT 等聽牌，卻沒擋 AQ、KQ、AJ、KJ。詐唬成功率太低，<b>過牌放棄</b>。"},
{c:"M",s:"總複習：你在 CO 開池，按鈕和大盲跟注。大盲過牌。",b:["Ac","8d","3s"],h:["Kh","Qh"],q:"你怎麼做？",o:["過牌","下注 1/3","下注 1/2"],a:0,e:"兩個對手至少一個有 A 的機率高，KQ 沒中又只有後門，後面還有按鈕。多人底池<b>過牌</b>，打得誠實。"},
{c:"A",s:"總複習：單挑，你在按鈕。翻牌下注 1/3 被跟，轉牌大盲過牌。",b:["Js","8s","3d","2c"],h:["As","5s"],q:"轉牌怎麼做？",o:["過牌拿免費牌","下注 1/3","下注 2/3～滿池"],a:2,e:"堅果同花聽牌是最佳半詐唬，<b>下大</b>。河牌沒中時還要有繼續詐唬的計畫。"},
{c:"R",s:"3 人底池河牌：CO 下注 1/2 底池，按鈕跟注，輪到你（大盲）。你有中等的一對。",b:["Qc","9d","5s","3h","2c"],h:["9c","8c"],q:"你怎麼做？",o:["跟注（價格很好）","棄牌"],a:1,e:"價格看起來更好，但已經有一個人跟注，表示至少有一個範圍很強的玩家。你就算抓到 CO 詐唬，也常輸給按鈕的跟注範圍。多人河牌<b>跟注要更緊</b>，數組合時兩個對手都要考慮。"},
{c:"A",s:"總複習：單挑，你在大盲跟注按鈕開池。翻牌你過牌，按鈕下注 1/3。",b:["Th","6c","2d"],h:["7h","6h"],q:"你怎麼做？",o:["棄牌","跟注","過牌加注"],a:1,e:"第二對最適合跟注抓詐唬。加注會讓差的牌棄、好的牌繼續。"},
{c:"B",s:"單挑，河牌出現第三張紅心，對手過牌。你想詐唬。對手會跟注的有同花和頂對。",b:["Qh","9h","4s","2c","3h"],h:null,q:"哪手比較適合詐唬？",o:["A♥5♣","J♣T♣"],a:0,e:"A♥ 讓對手不可能有堅果同花，你下注更像拿著 A♥ 同花，且擋掉他最強的跟注牌。JT 什麼也沒擋，還擋了他會棄的 JT、KJ 類聽牌。"},

const SY={s:"♠",h:"♥",d:"♦",c:"♣"};
const card=c=>`<span class="cd ${c[1]}">${c[0]=="T"?"10":c[0]}${SY[c[1]]}</span>`;
const fmt=t=>t.replace(/([AKQJT2-9])([♠♥♦♣])/g,(m,r,u)=>`<span class="su ${({"♠":"s","♥":"h","♦":"d","♣":"c"})[u]}">${r=="T"?"10":r}${u}</span>`);
let S=JSON.parse(localStorage.getItem("pkt")||"{}");const save=()=>localStorage.setItem("pkt",JSON.stringify(S));
let d=0,list=[],i=0,retry=false;const $=x=>document.getElementById(x);
function home(){let h=`<h1>♠ 撲克弱點特訓 ♥</h1><p class=sub>三天，每天約 30 分鐘</p>`;
DAYS.forEach((D,k)=>{const r=S[k]||{};const n=Object.keys(r).length,ok=Object.values(r).filter(x=>x).length;
h+=`<div class=day onclick="start(${k})"><b>${D.t}</b><div class=bar><i style="width:${n/D.q.length*100}%"></i></div><small>${n}/${D.q.length} 已作答・答對 ${ok}</small></div>`});
h+=catTable(null)+`<button class=ghost onclick="if(confirm('清除所有進度？')){S={};save();home()}">重設進度</button>`;$("app").innerHTML=h}
function catTable(k){const t={};DAYS.forEach((D,dk)=>{if(k!==null&&dk!==k)return;D.q.forEach((q,qi)=>{const v=(S[dk]||{})[qi];if(v===undefined)return;t[q.c]=t[q.c]||[0,0];t[q.c][1]++;if(v)t[q.c][0]++})});
let h=`<table><tr><th>弱點</th><th>正確率</th></tr>`;for(const c in CATS){const v=t[c];h+=`<tr><td>${CATS[c]}</td><td>${v?Math.round(v[0]/v[1]*100)+"%（"+v[0]+"/"+v[1]+"）":"—"}</td></tr>`}return h+"</table>"}
function start(k,wrong){d=k;retry=!!wrong;list=DAYS[k].q.map((_,x)=>x);if(wrong)list=list.filter(x=>(S[k]||{})[x]===false);i=0;show()}
function show(){if(i>=list.length)return summary();const q=DAYS[d].q[list[i]];
$("app").innerHTML=`<div class=top><button class=ghost onclick=home()>← 首頁</button><span>${retry?"重做錯題 ":""}${i+1}/${list.length}</span></div><div class=bar><i style="width:${i/list.length*100}%"></i></div>
<div class=tag>${CATS[q.c]}</div><p>${fmt(q.s)}</p>${q.b.length?`<div class=felt><small>公共牌</small><div>${q.b.map(card).join("")}</div>${q.h?`<small>你的手牌</small><div>${q.h.map(card).join("")}</div>`:""}</div>`:""}
<p class=q>${fmt(q.q)}</p><div id=opts>${q.o.map((o,x)=>`<button class=opt onclick="ans(${x})">${String.fromCharCode(65+x)}. ${fmt(o)}</button>`).join("")}</div><div id=exp></div>`}
function ans(x){const q=DAYS[d].q[list[i]],ok=x===q.a;S[d]=S[d]||{};S[d][list[i]]=ok;save();
document.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add("ok");else if(k===x)b.classList.add("bad")});
$("exp").innerHTML=`<div class="ex ${ok?"g":"r"}"><b>${ok?"✅ 答對":"❌ 答錯"}，正確答案：${String.fromCharCode(65+q.a)}</b><p>${fmt(q.e)}</p></div><button class=next onclick="i++;show()">下一題 →</button>`;$("exp").scrollIntoView({behavior:"smooth"})}
function summary(){const r=S[d]||{},n=DAYS[d].q.length,ok=Object.values(r).filter(x=>x).length,w=Object.values(r).filter(x=>!x).length;
$("app").innerHTML=`<h2>${DAYS[d].t} 完成！</h2><p class=big>${ok} / ${n}</p>${catTable(d)}${w?`<button class=next onclick="start(${d},1)">重做 ${w} 題錯題</button>`:"<p>全部答對 🎉</p>"}${d<2?`<button class=next onclick="start(${d+1})">前往第 ${d+2} 天</button>`:""}<button class=ghost onclick=home()>回首頁</button>`}
home();
</script></body></html>
